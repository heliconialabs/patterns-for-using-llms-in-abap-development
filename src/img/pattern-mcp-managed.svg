<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Developer -->
  <circle cx="60" cy="135" r="20" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="155" x2="60" y2="205" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="175" x2="35" y2="190" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="175" x2="85" y2="190" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="205" x2="35" y2="235" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="205" x2="85" y2="235" stroke="#333" stroke-width="2"/>
  <text x="60" y="260" text-anchor="middle" font-size="13" fill="#333">Developer</text>

  <!-- IDE + LLM -->
  <rect x="140" y="70" width="190" height="150" rx="8" fill="#e8eaf6" stroke="#3F51B5" stroke-width="2"/>
  <text x="235" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">IDE + LLM</text>
  <rect x="160" y="115" width="150" height="35" rx="5" fill="#fff" stroke="#9FA8DA" stroke-width="1.5"/>
  <text x="235" y="137" text-anchor="middle" font-size="12" fill="#303F9F">AI Agent</text>
  <rect x="160" y="160" width="150" height="35" rx="5" fill="#fff" stroke="#9FA8DA" stroke-width="1.5"/>
  <text x="235" y="182" text-anchor="middle" font-size="12" fill="#303F9F">MCP Client</text>

  <!-- Arrow: Developer to IDE -->
  <line x1="95" y1="160" x2="135" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <!-- Managed MCP Server -->
  <rect x="390" y="40" width="250" height="220" rx="8" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
  <text x="515" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#00695C">Managed ADT MCP Server</text>
  <text x="515" y="86" text-anchor="middle" font-size="11" fill="#00796B">(own server or SAP BTP)</text>
  <rect x="415" y="105" width="200" height="32" rx="4" fill="#fff" stroke="#80CBC4" stroke-width="1.5"/>
  <text x="515" y="126" text-anchor="middle" font-size="12" fill="#00695C">Identity and authentication</text>
  <rect x="415" y="145" width="200" height="32" rx="4" fill="#fff" stroke="#80CBC4" stroke-width="1.5"/>
  <text x="515" y="166" text-anchor="middle" font-size="12" fill="#00695C">Tool and package policies</text>
  <rect x="415" y="185" width="200" height="32" rx="4" fill="#fff" stroke="#80CBC4" stroke-width="1.5"/>
  <text x="515" y="206" text-anchor="middle" font-size="12" fill="#00695C">Audit logging</text>
  <rect x="415" y="225" width="200" height="22" rx="4" fill="#e8f5e9" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="515" y="240" text-anchor="middle" font-size="11" fill="#2E7D32">Read-only or controlled write</text>

  <!-- Arrow: IDE to Managed MCP -->
  <line x1="335" y1="160" x2="385" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <text x="360" y="150" text-anchor="middle" font-size="11" fill="#888">MCP</text>

  <!-- SAP System -->
  <rect x="690" y="70" width="140" height="170" rx="8" fill="#fff3e0" stroke="#FF9800" stroke-width="2"/>
  <text x="760" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">SAP System</text>
  <rect x="705" y="120" width="110" height="32" rx="4" fill="#fff" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="760" y="141" text-anchor="middle" font-size="12" fill="#F57C00">ADT Backend</text>
  <rect x="705" y="160" width="110" height="32" rx="4" fill="#fff" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="760" y="181" text-anchor="middle" font-size="12" fill="#F57C00">ABAP Objects</text>
  <rect x="705" y="200" width="110" height="25" rx="4" fill="#fff" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="760" y="217" text-anchor="middle" font-size="11" fill="#F57C00">Transports</text>

  <!-- Arrow: Managed MCP to SAP -->
  <line x1="645" y1="160" x2="685" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <text x="665" y="150" text-anchor="middle" font-size="11" fill="#888">ADT REST</text>

  <!-- Central Control -->
  <rect x="390" y="285" width="250" height="42" rx="8" fill="#ede7f6" stroke="#7E57C2" stroke-width="2"/>
  <text x="515" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#5E35B1">Central Control</text>
  <text x="515" y="319" text-anchor="middle" font-size="11" fill="#673AB7">Permissions, logging, and rollout are managed centrally</text>
  <line x1="515" y1="285" x2="515" y2="265" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow6)"/>

  <!-- Risk label -->
  <rect x="690" y="255" width="140" height="30" rx="4" fill="#fff8e1" stroke="#FFCA28" stroke-width="1.5"/>
  <text x="760" y="275" text-anchor="middle" font-size="12" fill="#F57F17">Medium risk: policy controlled</text>
</svg>
