<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Developer -->
  <circle cx="60" cy="105" r="20" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="125" x2="60" y2="175" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="145" x2="35" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="145" x2="85" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="175" x2="35" y2="205" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="175" x2="85" y2="205" stroke="#333" stroke-width="2"/>
  <text x="60" y="230" text-anchor="middle" font-size="13" fill="#333">Developer</text>

  <!-- IDE + LLM -->
  <rect x="130" y="45" width="190" height="165" rx="8" fill="#e8eaf6" stroke="#3F51B5" stroke-width="2"/>
  <text x="225" y="73" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">Any IDE + LLM</text>
  <rect x="150" y="90" width="150" height="35" rx="5" fill="#fff" stroke="#9FA8DA" stroke-width="1.5"/>
  <text x="225" y="112" text-anchor="middle" font-size="12" fill="#303F9F">AI Agent</text>
  <rect x="150" y="135" width="150" height="55" rx="5" fill="#fff" stroke="#9FA8DA" stroke-width="1.5"/>
  <text x="225" y="157" text-anchor="middle" font-size="12" fill="#303F9F">Local Files</text>
  <text x="225" y="175" text-anchor="middle" font-size="11" fill="#888">(ABAP source code)</text>

  <!-- Arrow: Developer to IDE -->
  <line x1="95" y1="135" x2="125" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <!-- Git Repository -->
  <rect x="390" y="45" width="170" height="160" rx="8" fill="#fce4ec" stroke="#E91E63" stroke-width="2"/>
  <text x="475" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#880E4F">Git Repository</text>
  <rect x="410" y="90" width="130" height="35" rx="4" fill="#fff" stroke="#F48FB1" stroke-width="1.5"/>
  <text x="475" y="112" text-anchor="middle" font-size="12" fill="#C2185B">Source Code</text>
  <rect x="410" y="135" width="130" height="30" rx="4" fill="#fff" stroke="#F48FB1" stroke-width="1.5"/>
  <text x="475" y="155" text-anchor="middle" font-size="12" fill="#C2185B">Pull Requests</text>
  <rect x="410" y="173" width="130" height="25" rx="4" fill="#fff" stroke="#F48FB1" stroke-width="1.5"/>
  <text x="475" y="190" text-anchor="middle" font-size="11" fill="#C2185B">Code Reviews</text>

  <!-- Arrow: IDE to Git -->
  <line x1="325" y1="135" x2="385" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#arrow7)"/>
  <text x="355" y="125" text-anchor="middle" font-size="11" fill="#888">git push</text>

  <!-- SAP System -->
  <rect x="700" y="110" width="170" height="140" rx="8" fill="#fff3e0" stroke="#FF9800" stroke-width="2"/>
  <text x="785" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">SAP System</text>
  <rect x="715" y="155" width="140" height="30" rx="4" fill="#fff" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="785" y="175" text-anchor="middle" font-size="12" fill="#F57C00">ABAP Objects</text>
  <rect x="715" y="193" width="140" height="25" rx="4" fill="#fff" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="785" y="210" text-anchor="middle" font-size="11" fill="#F57C00">abapGit</text>

  <!-- Arrow: Git to SAP -->
  <line x1="565" y1="140" x2="695" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow7)"/>
  <text x="645" y="132" text-anchor="middle" font-size="11" fill="#888">abapGit</text>

  <!-- Human review gate -->
  <circle cx="620" cy="88" r="15" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="620" y1="64" x2="620" y2="73" stroke="#333" stroke-width="1.5"/>
  <text x="620" y="57" text-anchor="middle" font-size="11" fill="#333">Human in</text>
  <text x="620" y="45" text-anchor="middle" font-size="11" fill="#333">the loop</text>

  <!-- Read-only MCP -->
  <rect x="130" y="265" width="220" height="90" rx="8" fill="#e3f2fd" stroke="#64B5F6" stroke-width="2"/>
  <text x="240" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Read-only ADT MCP</text>
  <text x="240" y="310" text-anchor="middle" font-size="11" fill="#1E88E5">Context and analysis only</text>
  <rect x="150" y="322" width="180" height="20" rx="4" fill="#e8f5e9" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="240" y="336" text-anchor="middle" font-size="11" fill="#2E7D32">No direct write access to SAP</text>

  <!-- Arrow: IDE to MCP -->
  <line x1="225" y1="215" x2="225" y2="260" stroke="#3F51B5" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow7)"/>
  <text x="275" y="238" text-anchor="middle" font-size="11" fill="#3F51B5">Context</text>

  <!-- Arrow: MCP to SAP -->
  <line x1="355" y1="310" x2="695" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow7)"/>
  <text x="525" y="255" text-anchor="middle" font-size="11" fill="#888">Read-only ADT tools</text>

  <!-- CI/CD Pipeline -->
  <rect x="390" y="270" width="170" height="80" rx="8" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
  <text x="475" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#00695C">CI / CD</text>
  <text x="475" y="313" text-anchor="middle" font-size="11" fill="#00796B">Static Analysis</text>
  <text x="475" y="330" text-anchor="middle" font-size="11" fill="#00796B">Unit Tests</text>

  <!-- Arrow: Git to CI -->
  <line x1="475" y1="210" x2="475" y2="265" stroke="#555" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <!-- Feedback arrow -->
  <path d="M 390 310 L 225 310 L 225 215" fill="none" stroke="#009688" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow7)"/>
  <text x="315" y="302" text-anchor="middle" font-size="10" fill="#009688">Feedback to LLM</text>

  <!-- Risk label -->
  <rect x="700" y="270" width="170" height="30" rx="4" fill="#e8f5e9" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="785" y="290" text-anchor="middle" font-size="12" fill="#2E7D32">Low risk: write path stays gated</text>
</svg>
